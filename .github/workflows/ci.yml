name: FixFlow CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-ci:
    name: Backend Build & Tests (.NET 9)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore Dependencies
        run: dotnet restore FixFlow.sln

      - name: Build Solution
        run: dotnet build FixFlow.sln --no-restore --configuration Release

      - name: Run Backend Tests (Unit, Integration, Architecture)
        run: dotnet test FixFlow.sln --no-build --configuration Release --verbosity normal

  frontend-ci:
    name: Frontend Build & Tests (React + TypeScript)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Lint Code
        run: npm run lint

      - name: Run Frontend Tests
        run: npm run test

      - name: Build Production Bundle
        run: npm run build
